# electron-builder configuration.
#
# Offline Windows resources are staged explicitly by prepare:resources.
# Signed release packaging is the default; unsigned builds are rehearsal only.
appId: ph.hexpayroll.desktop
productName: Hex Payroll
copyright: Copyright © 2026 Hex Payroll

directories:
  output: release
  buildResources: build

# Ship only the built outputs, never the TypeScript sources.
files:
  - out/**
  - package.json

# apps/web's production build is shipped alongside the app and loaded over
# a private loopback server in main — see apps/desktop/src/main/index.ts.
extraResources:
  - from: ../web/dist
    to: web
    filter: ['**/*', '!**/*.map']
  - from: build/standalone
    to: .

asar: true
forceCodeSigning: true
beforePack: ./scripts/audit-resources.cjs
afterAllArtifactBuild: ./scripts/artifact-checksums.cjs
artifactName: Hex-Payroll-${version}-${arch}-Setup.${ext}

win:
  requestedExecutionLevel: asInvoker
  target:
    - target: nsis
      arch: [x64]
  # Code signing is REQUIRED before distributing to real users: an unsigned
  # installer triggers Windows SmartScreen warnings on every machine.

nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  deleteAppDataOnUninstall: false
  runAfterFinish: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true

# Auto-update is intentionally NOT configured.
# For a payroll system, silently shipping changed contribution or tax tables
# mid-period is an incident rather than a convenience. It will be added
# deliberately, with an explicit opt-in, in Phase 4.
