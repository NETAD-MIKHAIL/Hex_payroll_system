# Windows x64 desktop distribution. Runtime staging is required before packaging.
appId: ph.hexpayroll.desktop
productName: Hex Payroll
beforePack: scripts/validate-desktop.cjs
afterPack: scripts/copy-runtime.cjs
copyright: Copyright © 2026 Hex Payroll

directories:
  output: release
  buildResources: build

# Ship only the built outputs, never the TypeScript sources.
files:
  - out/**
  - package.json

# Static renderer resources are served through the fixed application protocol.
extraResources:
  - from: ../web/dist
    to: web
  - from: build/runtime/api
    to: api
  - from: build/runtime/postgres
    to: postgres
  - from: build/runtime/migrations
    to: migrations
  - from: build/runtime/notices
    to: notices
  - from: build/runtime/package-manifest.json
    to: package-manifest.json

win:
  icon: build/icon.ico
  requestedExecutionLevel: asInvoker
  target:
    - nsis
  # Supply an approved signing identity before production distribution.
  # Unsigned builds may trigger SmartScreen or application-control policies.

nsis:
  artifactName: Hex Payroll Setup.exe
  deleteAppDataOnUninstall: false
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

# Auto-update is intentionally NOT configured.
# For a payroll system, silently shipping changed contribution or tax tables
# mid-period is an incident rather than a convenience. It will be added
# deliberately in Phase 4.5 or later.
